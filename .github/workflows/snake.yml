name: gerar cobrinha das contribuicoes

on:
  schedule:
    - cron: "0 */12 * * *"   # duas vezes por dia
  workflow_dispatch:          # botao manual na aba Actions
  push:
    branches:
      - main

jobs:
  gerar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: gerar svg
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=%2300FF9C&color_dots=%2307100C,%230d4429,%2300a86b,%2300d68f,%2300ff9c

      - name: publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
